# gprm settings. Command-line flags override these defaults.
# Restore keeps the saved session and adds discovered PRs on every launch.
startup = "restore" # restore | clipboard | empty | auto-discover
auto_quit = "all-closed" # never | builds-finished | all-passing | all-closed
completed_retention = "24h" # time since merge/closure; forever keeps until dismissed; 0s hides immediately
interval = "5s"
request_timeout = "20s"
# Default order: comma-separated jira, target, repo, branch, progress.
# jira is shorthand for jira,target,repo,branch and must lead when included.
# Unticketed PRs follow ticket groups, ordered by the remaining keys.
sort = "repo" # e.g. "jira,target,repo" or "target,repo"
descending = false
# Hide one leading prefix in the TARGET column only (literal, case-sensitive).
# Longest match wins; full names remain in details, sorting, filtering, and updates.
target_branch_ignored_prefixes = [] # e.g. ["support/"]
no_color = false # also controlled by --no-color and NO_COLOR
ci_column = "auto" # auto | always | never
github_host = "github.com"
discovery_limit = 100

# Match title prefixes case-insensitively. Empty list accepts any project code.
[jira]
base_url = "" # e.g. https://jira.example.com (without /browse)
project_prefixes = [] # e.g. ["ABC", "OPS"]

[tools]
gh = "gh" # executable name or absolute path
# Empty clipboard/open paths select the platform default.
clipboard = ""
clipboard_args = []
clipboard_write = "" # Text is sent to this command on stdin
clipboard_write_args = []
open = ""
open_args = []
# macOS: clipboard = "/usr/bin/pbpaste", open = "/usr/bin/open"
# Wayland: clipboard = "wl-paste", clipboard_args = ["--no-newline"]
# X11: clipboard = "xclip", clipboard_args = ["-selection", "clipboard", "-o"]

# Add an entry for each Jenkins server. Credentials are sent only to its
# exact origin and URL path prefix. Cross-origin redirects are rejected.
# Environment values override inline credentials when set.
# [[jenkins]]
# url = "https://ci.example.com/jenkins"
# user = ""
# token = ""
# user_env = "JENKINS_USER"
# token_env = "JENKINS_API_TOKEN"
